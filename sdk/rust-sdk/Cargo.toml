[package]
name = "rust-sdk-example"
version = "0.1.0"
edition = "2021"

[dependencies]
payabli_api = "2.0.20"
axum = "0.8.9"
tokio = { version = "1.54", features = ["full"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
serde = { version = "1.0.229", features = ["derive"] }
# `config` (askama.toml support) is disabled: this app uses the default
# templates/ dir, and that feature pulls in the unmaintained basic-toml crate.
askama = { version = "0.16.1", default-features = false, features = ["derive", "std", "urlencode"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
