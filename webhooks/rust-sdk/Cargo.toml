[package]
name = "rust-sdk"
version = "0.1.0"
edition = "2024"

[dependencies]
payabli_api = "2.0.20"
tokio = { version = "1.54", features = ["full"] }
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
reqwest = { version = "0.13.5", features = ["json"] }
